# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: BGl1ZM5bQwHkzV_0gXhyTCSjJDn-Hz_0PqQAeP1EQk2_A1kjc7yWCZOgjKZScUTUcUB2G1BaNW3bmaV6SZqEFA4


scheduledTasks:
  - id: check-free-listings
    schedule: "0 0 * * *"
    timeZone: "Etc/UTC"
    uri: /api/cron/check-free-listings
    httpMethod: get
  - id: check-expired-announcements
    schedule: "0 1 * * *"
    timeZone: "Etc/UTC"
    uri: /api/cron/check-expired-announcements
    httpMethod: get
  - id: cleanup-lost-and-found
    schedule: "0 2 * * *"
    timeZone: "Etc/UTC"
    uri: /api/cron/cleanup-lost-and-found
    httpMethod: get
  - id: cleanup-expired-reports
    schedule: "0 3 * * *"
    timeZone: "Etc/UTC"
    uri: /api/cron/cleanup-expired-reports
    httpMethod: get
