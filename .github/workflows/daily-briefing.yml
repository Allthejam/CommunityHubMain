name: Daily 7:30AM Community Briefing

on:
  schedule:
    # Runs at 06:30, 07:30, and 08:00 UTC so Europe/London 07:30 is covered year-round (BST & GMT) even with cron jitter
    - cron: '30 6,7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 7:30AM Daily Briefing Endpoint
        run: |
          curl -fsSL --max-time 60 -X GET "https://www.my-community-hub.co.uk/api/cron/daily-briefing?cronCheck=1"
