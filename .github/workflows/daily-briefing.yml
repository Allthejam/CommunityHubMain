name: Daily 8AM Community Briefing

on:
  schedule:
    # Runs at 07:00 and 08:00 UTC so Europe/London 08:00 is covered year-round (GMT & BST)
    - cron: '0 7,8 * * *'
  workflow_dispatch:

jobs:
  send-daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 8AM Daily Briefing Endpoint
        run: |
          curl -fsSL -X GET "https://www.my-community-hub.co.uk/api/cron/daily-briefing?cronCheck=1"
