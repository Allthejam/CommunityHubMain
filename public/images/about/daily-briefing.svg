<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)" />

  <!-- Main Morning Bulletin Card -->
  <rect x="90" y="36" width="620" height="448" rx="22" fill="#ffffff" stroke="#fcd34d" stroke-width="3" />
  <path d="M90 58 Q90 36 112 36 L688 36 Q710 36 710 58 L710 124 L90 124 Z" fill="url(#hdr)" />
  <circle cx="132" cy="70" r="16" fill="#fef08a" />
  <text x="160" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">8:00 AM Morning Bulletin</text>
  <text x="116" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fffbeb">Good morning! This is your morning bulletin from your community.</text>

  <!-- Leader Notice Card -->
  <rect x="116" y="142" width="568" height="78" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" />
  <rect x="116" y="142" width="8" height="78" rx="4" fill="#10b981" />
  <text x="140" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#065f46">Community Leader Notices</text>
  <text x="140" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#047857">Town Hall Council Meeting tonight at 7:00 PM — all residents welcome</text>
  <text x="140" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669">Auto-clears after 20 hours</text>

  <!-- Weather Card -->
  <rect x="116" y="232" width="568" height="64" rx="14" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2" />
  <text x="140" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0c4a6e">Weather &amp; Storm Warnings</text>
  <text x="140" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0369a1">9°C (high 11°C), gusts 18 mph, rain 1.2 mm — anchored to Town Centre Pin</text>

  <!-- Roadworks Card -->
  <rect x="116" y="308" width="568" height="64" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
  <text x="140" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#78350f">Local Travel &amp; 30-Mile Roadworks</text>
  <text x="140" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309">Live closures &amp; active works within 30 miles (A9, A95, A938)</text>

  <!-- Schools Card -->
  <rect x="116" y="384" width="568" height="72" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" />
  <text x="140" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#312e81">Schools &amp; 5-Day Holiday Countdowns</text>
  <text x="140" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4338ca">All schools open • 5-day countdown before holidays &amp; back-to-school</text>
</svg>
